<section class="home-hero" aria-label="Busca de especialistas">
    <div>
        <p class="home-kicker">Directório Médico</p>
        <h1 class="home-title">
        Encontre Especialistas<br />
        <strong>de Excelência.</strong>
        </h1>
    </div>
    <div class="container-search">
        <div class="width-uf">
            <app-select-event-location
                id="uf"
                name="uf"
                type="uf"
                [options]="ufOptions"
                [selectedValue]="selectedUf"
                (selectionChange)="onUfChange($event)">
            </app-select-event-location>
        </div>
        <div class="width-city">
            <app-select-event-location
                id="city"
                name="city"
                type="city"
                [options]="cityOptions"
                [selectedValue]="selectedCity"
                (selectionChange)="onCityChange($event)">
            </app-select-event-location>
        </div>
        <label  for="busca" class="home-search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" />
            <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <input
                id="busca"
                type="text"
                placeholder="Buscar por nome ou especialidade..."
                [value]="searchTerm"
                (input)="onSearchChange($event)" />
        </label>
    </div>
</section>
<section class="home-grid" aria-label="Lista de especialistas">
    @for(doctor of filteredDoctors; track doctor.id; let i = $index) {
        <app-doctor-card 
            [id]="doctor.id"
            [slug]="doctor.slug"
            [acronym]="doctor.acronym"
            [name]="doctor.name"
            [avatarIndex]="i"
            [status]="doctor.status"
            [specialty]="doctor.specialty"
            [crm]="doctor.crm"
            [phone]="doctor.phone"
            [unidade]="doctor.unidade">
        </app-doctor-card>
    }
    <article class="add-card">
        <div>
        <div class="add-card__icon" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            <path d="M5.5 18.5C7.4 16.35 9.55 15.25 12 15.25C14.45 15.25 16.6 16.35 18.5 18.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
            </svg>
        </div>
        <h3>Adicionar Novo</h3>
        <p>Expanda sua equipe clínica integrando novos profissionais.</p>
        </div>
    </article>
</section>
