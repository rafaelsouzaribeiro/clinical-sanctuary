<div class="container-search">
  <div class="width-uf">
    <div class="profile-control">
      <select id="uf" name="uf" [value]="selectedID" (change)="onUfSelect($event)">
        @for (option of ufOptions; track option.state_id) {
          <option [value]="option.state_id" [selected]="option.state_id === selectedID">
            {{ option.name }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="width-city">
    <div class="profile-control city-combobox">
      <input
        id="city"
        type="text"
        autocomplete="off"
        placeholder="Buscar cidade..."
        [value]="cityInputValue"
        (input)="onCityInputChange($event)"
        (focus)="onCityInputFocus()"
        (blur)="onCityInputBlur()" />

      @if (isCityDropdownOpen && filteredCityOptions.length) {
        <ul class="city-dropdown">
          @for (option of filteredCityOptions; track option.city_id) {
            <li
              [class.selected]="option.city_id === selectedCity"
              (mousedown)="selectCity(option)">
              {{ option.name_city }}
            </li>
          }
        </ul>
      }

      @if (isCityDropdownOpen && !filteredCityOptions.length) {
        <ul class="city-dropdown">
          <li class="no-results">Nenhuma cidade encontrada</li>
        </ul>
      }
    </div>
  </div>

  <label for="busca" class="home-search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" />
      <path d="M16 16L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <input
      id="busca"
      type="text"
      placeholder="Buscar por nome ou especialidade..."
      [value]="searchTerm"
      (input)="onSearchChange($event)" />
  </label>
</div>
