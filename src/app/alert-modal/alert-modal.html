@if(showModal){
    <div class="modal-overlay" (click)="closeModal()">
        <div class="modal-box" (click)="$event.stopPropagation()">
        <div class="modal-icon">⚠️</div>
        <h3>Atenção</h3>
        <p [innerHTML]="message"></p>
        <button class="modal-btn" (click)="closeModal()">Entendi</button>
        </div>
    </div>
}
